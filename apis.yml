name: Pack
description: >-
  Pack is an AI-powered skill management platform for HR and People teams. The
  product helps organizations map skills into future-proof ontologies, assess
  proficiency across teams, identify strategic skill gaps, and build
  personalized development plans for employees. Additional capabilities include
  business impact analysis, a Return on Development Investment (RODI) calculator,
  and access to a network of 1,000+ certified trainers for mentoring and
  coaching. Pack integrates with existing HRIS and LMS systems. The company
  (Pack SRL) has raised approximately EUR 5.8M and is backed by Anthemis and
  Techstars. This profile was added to the API Evangelist network as a
  VC-portfolio lead; as of this enrichment pass Pack publishes no public API,
  developer portal, or SDKs.
